<title>文湖線衣櫥</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style id="shop-css">
:root{
  --bg:#F1F2EE;--surface:#FFFFFF;--surface-2:#E7E9E3;--ink:#1B201D;--ink-2:#58615B;--ink-3:#7E8680;--line:#D6DAD2;
  --wenhu:#A8742A;--wenhu-soft:#F2E7D6;--on-wenhu:#FFFFFF;
  --ok:#2E7550;--ok-soft:#DDEEE3;--warn:#935F12;--warn-soft:#F6E9CF;--sold:#A43B2B;--sold-soft:#F4DEDA;
  --shadow:0 1px 2px rgb(27 32 29 / .06),0 12px 32px -14px rgb(27 32 29 / .22);
  --f-display:"LXGW WenKai TC","Kaiti TC","STKaiti","BiauKai",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#121513;--surface:#1A1E1B;--surface-2:#252A26;--ink:#E8EBE5;--ink-2:#A6AEA8;--ink-3:#7D857F;--line:#303631;
  --wenhu:#D49B4A;--wenhu-soft:#35291A;--on-wenhu:#1A1206;
  --ok:#6CC08F;--ok-soft:#1D3326;--warn:#E3AE55;--warn-soft:#3A2E17;--sold:#E88474;--sold-soft:#3B211D;
  --shadow:0 1px 2px rgb(0 0 0 / .4),0 12px 32px -14px rgb(0 0 0 / .7);}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#121513;--surface:#1A1E1B;--surface-2:#252A26;--ink:#E8EBE5;--ink-2:#A6AEA8;--ink-3:#7D857F;--line:#303631;
  --wenhu:#D49B4A;--wenhu-soft:#35291A;--on-wenhu:#1A1206;
  --ok:#6CC08F;--ok-soft:#1D3326;--warn:#E3AE55;--warn-soft:#3A2E17;--sold:#E88474;--sold-soft:#3B211D;
  --shadow:0 1px 2px rgb(0 0 0 / .4),0 12px 32px -14px rgb(0 0 0 / .7);}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--wenhu);outline-offset:2px}
a{color:var(--wenhu)}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:16px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance}

/* header */
.top{display:flex;flex-wrap:wrap;gap:20px 32px;align-items:flex-end;justify-content:space-between;padding-block:32px 20px}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);letter-spacing:.08em}
.badge-br{display:inline-grid;place-items:center;min-width:30px;height:22px;padding:0 6px;border-radius:6px;background:var(--wenhu);color:var(--on-wenhu);font:600 12px/1 var(--f-mono);letter-spacing:.02em}
.top h1{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,6vw,54px);line-height:1.1;margin:10px 0 8px;letter-spacing:.02em}
.tagline{margin:0;color:var(--ink-2);max-width:34em}
.facts{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px;font-size:13px;color:var(--ink-2)}
.facts b{color:var(--ink);font-family:var(--f-mono);font-weight:600}
.contact{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.contact .lbl{font-size:12px;color:var(--ink-3);letter-spacing:.1em}
.contact .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lid{font:600 22px/1.2 var(--f-mono);letter-spacing:.02em;user-select:all}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--wenhu);border-color:var(--wenhu);color:var(--on-wenhu);font-weight:500}
.btn.primary:hover{filter:brightness(1.06)}
.btn.sm{padding:4px 11px;font-size:13px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--sold);border-color:var(--sold)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.line-btn{background:#06C755;border-color:#06C755;color:#fff}
.admin-entry{margin-top:4px}

/* banner */
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--wenhu-soft);border:1px solid var(--wenhu);border-radius:12px;padding:10px 14px;margin-block:0 16px;font-size:14px}

/* filters */
.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px}
.frow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:8px 2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sel{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink-2)}

/* grid */
.shelf-head{display:flex;justify-content:space-between;align-items:baseline;margin-block:20px 12px;gap:12px}
.shelf-head h2{font-family:var(--f-display);font-size:24px;margin:0}
.count{font-size:13px;color:var(--ink-3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:18px 14px}
.card{position:relative;min-width:0}
.card-hit{display:block;width:100%;text-align:left;border:0;background:none;padding:0}
.ph{display:block;position:relative;aspect-ratio:1;max-width:100%;border-radius:12px;overflow:hidden;background:var(--surface-2)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}
.card-hit:hover .ph img{transform:scale(1.03)}
.card.sold .ph img{filter:grayscale(.85) opacity(.6)}
.ribbon{position:absolute;left:10px;bottom:10px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.ribbon.warn{background:var(--warn-soft);color:var(--warn)}
.ribbon.sold{background:var(--sold-soft);color:var(--sold)}
.meta{padding:10px 2px 0;display:grid;gap:3px}
.cond{display:block}
.code{font:500 12px/1 var(--f-mono);color:var(--ink-3);display:flex;gap:6px;align-items:center}
.sample{font:500 11px/1 var(--f-body);background:var(--surface-2);color:var(--ink-2);border-radius:4px;padding:3px 5px}
.meta .ttl{font-size:15px;font-weight:500;margin:0;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prow{display:flex;align-items:center;gap:8px}
.price{font:600 16px/1.2 var(--f-mono);font-variant-numeric:tabular-nums}
.size{font:500 12px/1 var(--f-mono);border:1px solid var(--line);border-radius:5px;padding:3px 6px;color:var(--ink-2)}
.cond{font-size:12px;color:var(--ink-3)}
.ask{position:absolute;top:8px;right:8px;border:0;border-radius:999px;background:rgb(255 255 255 / .92);color:#1B201D;font-size:12px;font-weight:500;padding:5px 10px;box-shadow:0 1px 3px rgb(0 0 0 / .15)}
.ask.on{background:var(--wenhu);color:var(--on-wenhu)}
.empty{grid-column:1/-1;color:var(--ink-2);padding:40px 0;text-align:center}

/* how to buy */
.howto{margin-block:56px 24px}
.howto>h2{font-family:var(--f-display);font-size:28px;margin:0 0 6px}
.howto>p{margin:0 0 20px;color:var(--ink-2)}
.ways{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.way{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px}
.way h3{margin:0 0 4px;font-size:18px;display:flex;align-items:center;gap:8px}
.way .sub{margin:0 0 14px;color:var(--ink-2);font-size:14px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:0}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;position:relative;padding-bottom:12px}
.steps li:not(:last-child)::before{content:"";position:absolute;left:13px;top:26px;bottom:0;width:2px;background:var(--line)}
.steps .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:600 13px/1 var(--f-mono);background:var(--surface-2);color:var(--ink-2)}
.steps b{display:block;font-weight:500}
.steps span.d{font-size:13px;color:var(--ink-2)}
.note-line{font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:8px 12px;margin-top:4px}

/* wenhu strip */
.metro{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 0 10px}
.metro-h{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;padding-inline:18px}
.metro-h h3{margin:0;font-size:17px;display:flex;align-items:center;gap:8px}
.metro-h p{margin:0;font-size:13px;color:var(--ink-2)}
.strip{display:flex;overflow-x:auto;padding:14px 18px 6px;scrollbar-width:thin}
.stop{position:relative;flex:1 0 38px;min-width:38px;display:flex;flex-direction:column;align-items:center;gap:8px;border:0;background:none;padding:0 0 4px;color:var(--ink-2)}
.stop::before{content:"";position:absolute;top:7px;left:0;right:0;height:6px;background:var(--wenhu)}
.stop:first-child::before{left:50%}
.stop:last-child::before{right:50%}
.stop .dot{position:relative;width:20px;height:20px;border-radius:50%;background:var(--surface);border:4px solid var(--wenhu)}
.stop.tr .dot{border-width:3px;box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink-3)}
.stop .nm{writing-mode:vertical-rl;white-space:nowrap;font-size:13px;letter-spacing:.12em;line-height:1}
.stop:hover .nm,.stop.on .nm{color:var(--ink);font-weight:700}
.stop.on .dot{background:var(--wenhu)}
.metro-legend{display:flex;gap:14px;font-size:12px;color:var(--ink-3);padding:4px 18px 0}
.metro-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;border:2px solid var(--wenhu);margin-right:4px;vertical-align:-1px}
.metro-legend i.tr{box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--ink-3)}

footer.foot{border-top:1px solid var(--line);margin-top:40px;padding-block:20px 90px;color:var(--ink-3);font-size:13px;display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between}
.linkish{border:0;background:none;color:var(--ink-3);text-decoration:underline;padding:0;font-size:13px}

/* overlays */
.layer{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px}
.ov{position:absolute;inset:0;background:rgb(10 14 11 / .55)}
.dlg{position:relative;background:var(--bg);border-radius:18px;width:min(980px,100%);max-height:calc(100% - 8px);overflow:auto;box-shadow:var(--shadow)}
.dlg.narrow{width:min(520px,100%)}
.x{position:absolute;top:10px;right:10px;z-index:2;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1}
.dgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
@media (max-width:760px){.dgrid{grid-template-columns:1fr}}
.gal{padding:16px;display:grid;gap:10px;align-content:start}
.gal .main{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:var(--surface-2);display:block}
.gthumbs{display:flex;gap:8px;flex-wrap:wrap}
.gthumbs button{padding:0;border:2px solid transparent;border-radius:10px;overflow:hidden;width:64px;height:64px;background:var(--surface-2)}
.gthumbs button[aria-pressed="true"]{border-color:var(--wenhu)}
.gthumbs img{width:100%;height:100%;object-fit:cover;display:block}
.info{padding:22px 20px 20px;display:grid;gap:12px;align-content:start}
.info h2{font-family:var(--f-display);font-size:28px;line-height:1.25;margin:0;padding-right:36px}
.pbox{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.price.big{font-size:26px}
.pbox s{color:var(--ink-3);font-size:13px}
.st{display:inline-flex;width:max-content;align-items:center;gap:6px;font-size:13px;font-weight:500;border-radius:999px;padding:3px 11px}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.ok{background:var(--ok-soft);color:var(--ok)}
.st.warn{background:var(--warn-soft);color:var(--warn)}
.st.sold{background:var(--sold-soft);color:var(--sold)}
.spec{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0;font-size:14px}
.spec dt{color:var(--ink-3)}
.spec dd{margin:0}
.mtable{border-collapse:collapse;font-size:14px;width:100%}
.mtable th,.mtable td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
.mtable th{font-weight:400;color:var(--ink-3);font-size:12px}
.mtable td{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sec-t{font-size:12px;color:var(--ink-3);letter-spacing:.1em;margin:0 0 4px}
.itemnote{margin:0;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;white-space:pre-wrap}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.fine{font-size:13px;color:var(--ink-3);margin:0}

/* inquiry sheet */
.sheet{padding:22px 20px 20px;display:grid;gap:18px}
.sheet h2{font-family:var(--f-display);font-size:26px;margin:0;padding-right:36px}
.stp{display:grid;gap:10px}
.stp-h{display:flex;align-items:center;gap:10px;font-weight:500}
.stp-h .n{width:24px;height:24px;border-radius:50%;background:var(--wenhu);color:var(--on-wenhu);display:grid;place-items:center;font:600 12px/1 var(--f-mono)}
.inq{display:grid;gap:8px}
.inq-row{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 8px 6px 6px}
.inq-row img{width:48px;height:48px;border-radius:8px;object-fit:cover;display:block}
.inq-row .t{font-size:14px;line-height:1.35;min-width:0}
.inq-row .t small{display:block;color:var(--ink-3);font-family:var(--f-mono);font-size:12px}
.total{display:flex;justify-content:space-between;font-size:14px;color:var(--ink-2);padding-inline:4px}
.methods{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.method{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left}
.method b{display:block;font-weight:500}
.method small{color:var(--ink-3);font-size:12px}
.method[aria-pressed="true"]{border-color:var(--wenhu);background:var(--wenhu-soft)}
.field{display:grid;gap:4px;font-size:13px;color:var(--ink-2)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;color:var(--ink);font-size:15px;min-width:0;width:100%}
.msg{margin:0;white-space:pre-wrap;background:var(--surface);border:1px dashed var(--ink-3);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.7;user-select:all}
.lidbox{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.lidbox .lid{margin-right:auto}

/* floating bar */
.ibar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none;display:flex;justify-content:center}
.ibar-in{pointer-events:auto;display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 8px 8px 18px;box-shadow:var(--shadow);max-width:100%}
.ibar-in span{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* admin */
.adm{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;padding-bottom:env(safe-area-inset-bottom,0px)}
.adm-bar{position:sticky;top:0;z-index:3;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.adm-bar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding-block:10px}
.adm-bar h2{margin:0 auto 0 0;font-family:var(--f-display);font-size:22px;display:flex;align-items:center;gap:10px}
.pill{font-size:12px;border-radius:999px;padding:3px 10px;background:var(--surface-2);color:var(--ink-2)}
.pill.dirty{background:var(--warn-soft);color:var(--warn);font-weight:500}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:0 8px}
.tab{border:0;background:none;padding:6px 12px;border-radius:8px;color:var(--ink-2);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.adm-body{padding-block:18px 60px;display:grid;gap:16px}
.amsg{border-radius:12px;padding:10px 14px;font-size:14px;background:var(--wenhu-soft);border:1px solid var(--wenhu)}
.amsg.err{background:var(--sold-soft);border-color:var(--sold);color:var(--ink)}
.meter{display:grid;gap:6px;font-size:13px;color:var(--ink-2)}
.meter .bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--wenhu);border-radius:99px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.alist{display:grid;gap:8px}
.arow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px}
.arow img{width:56px;height:56px;border-radius:8px;object-fit:cover;display:block}
.arow .t{min-width:0;font-size:14px;line-height:1.4}
.arow .t small{display:block;color:var(--ink-3);font-size:12px}
.arow .ctl{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-items:center}
@media (max-width:560px){.arow{grid-template-columns:56px minmax(0,1fr)}.arow .ctl{grid-column:1/-1;justify-content:flex-start}}
.ed{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.ed{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:14px}
.panel h3{margin:0;font-size:16px}
.drop{display:grid;place-items:center;text-align:center;gap:4px;border:2px dashed var(--line);border-radius:12px;padding:18px;color:var(--ink-2);font-size:14px;cursor:pointer}
.drop.over{border-color:var(--wenhu);background:var(--wenhu-soft)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.pthumbs{display:flex;gap:8px;flex-wrap:wrap}
.pthumb{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;border:2px solid transparent;padding:0;background:var(--surface-2)}
.pthumb[aria-pressed="true"]{border-color:var(--wenhu)}
.pthumb img,.pthumb canvas{width:100%;height:100%;object-fit:cover;display:block}
.pthumb em{position:absolute;left:3px;top:3px;font-style:normal;font-size:10px;background:var(--wenhu);color:var(--on-wenhu);border-radius:4px;padding:1px 4px}
.stage{position:relative;border-radius:12px;overflow:hidden;background:var(--surface-2);aspect-ratio:1;max-width:100%}
.stage canvas,.stage img{width:100%;height:100%;display:block;object-fit:cover}
.stage canvas.pick{cursor:crosshair}
.stage .busy{position:absolute;inset:auto 8px 8px auto;font-size:12px;background:rgb(0 0 0 / .6);color:#fff;border-radius:6px;padding:2px 8px}
.warnline{font-size:13px;color:var(--warn);background:var(--warn-soft);border-radius:10px;padding:8px 12px}
.tools{display:grid;gap:12px}
.trow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.slider{display:grid;grid-template-columns:4.5em 1fr 3em;gap:10px;align-items:center;font-size:13px;color:var(--ink-2)}
.slider input{width:100%;accent-color:var(--wenhu)}

function addFiles(files) {

  });
  var csv = '﻿' + [head].concat(rows).map(function (r) { return r.map(function (c) { c = String(c == null ? '' : c); return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(','); }).join('\r\n');
  var d = new Date(), stamp = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
  caps.dl.save({ filename: '商品清單_' + stamp + '.csv', data: csv }).then(function () { toast('已匯出'); }, function (e) { if (!e || e.code !== 'declined') toast('匯出失敗（' + ((e && e.code) || '未知') + '）'); });
}

function renderAll() { renderPublic(); renderModal(); renderSheet(); renderAdmin(); renderBar(); lockScroll(); }

/* ---------- events ---------- */
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act]'); if (!t) return;
  var a = t.dataset.act, v = t.dataset.v, ed = admin.ed, cur = ed && ed.photos[ed.active];
  switch (a) {
    case 'open': ui.open = v; ui.photo = 0; renderModal(); renderBar(); break;
    case 'close-modal': ui.open = null; renderModal(); renderBar(); break;
    case 'gphoto': ui.photo = Number(v); renderModal(); break;
    case 'ask': {
      var i = inquiry.indexOf(v);
      if (i >= 0) inquiry.splice(i, 1); else { inquiry.push(v); toast('已加入詢問清單'); }
      saveInq(); renderGrid(); if (ui.open) renderModal(); renderBar(); break;
    }
    case 'buy': if (inquiry.indexOf(v) < 0) { inquiry.push(v); saveInq(); } ui.open = null; ui.sheet = true; renderModal(); renderGrid(); renderSheet(); renderBar(); break;
    case 'sheet-open': ui.sheet = true; renderSheet(); renderBar(); break;
    case 'sheet-close': ui.sheet = false; renderSheet(); renderBar(); break;
    case 'inq-rm': inquiry = inquiry.filter(function (x) { return x !== v; }); saveInq(); renderSheet(); renderGrid(); break;
    case 'method': pref.method = v; savePref(); renderSheet(); break;
    case 'station':
      pref.station = v; pref.method = 'meet'; savePref();
      document.querySelectorAll('.stop').forEach(function (s) { var on = s.dataset.v === v; s.classList.toggle('on', on); s.setAttribute('aria-pressed', on); });
      toast('面交站：' + v.replace('文湖線 ', '') + '，私訊時會自動帶入'); break;
    case 'copy-msg': copyText(buildMsg(), t, '#msg'); break;
    case 'copy-id': copyText(view().shop.lineId, t, t.dataset.t); break;
    case 'cat': ui.cat = v; saveUi(); document.querySelectorAll('.chip').forEach(function (c) { c.setAttribute('aria-pressed', c.dataset.v === v); }); renderGrid(); break;
    case 'admin-open': openAdmin(); break;
    case 'admin-close': closeAdmin(); break;
    case 'discard': draft = null; admin.changes = {}; renderAll(); break;
    case 'tab': admin.tab = v; admin.msg = ''; renderAdmin(); break;
    case 'publish': publishDraft(); break;
    case 'new': admin.ed = blankEditor(); admin.tab = 'edit'; admin.msg = ''; renderAdmin(); break;
    case 'edit': admin.msg = ''; editItem(v); break;
    case 'del':
      if (admin.confirmDel !== v) { admin.confirmDel = v; renderAdminTab(); break; }
      var gone = draft.items.filter(function (x) { return x.id === v; })[0];
      draft.items = draft.items.filter(function (x) { return x.id !== v; });
      addLog('刪除', v, gone ? gone.title : ''); markDirty('item:' + v); admin.confirmDel = null; renderAll(); break;
    case 'del-cancel': admin.confirmDel = null; renderAdminTab(); break;
    case 'clear-samples':
      if (!admin.confirmClear) { admin.confirmClear = true; renderAdminTab(); break; }
      var ids = draft.items.filter(function (x) { return x.sample; }).map(function (x) { return x.id; });
      draft.items = draft.items.filter(function (x) { return !x.sample; });
      addLog('刪除', ids.join(','), '清除範例商品 ' + ids.length + ' 件'); markDirty('samples'); admin.confirmClear = false; renderAll(); break;
    case 'clear-cancel': admin.confirmClear = false; renderAdminTab(); break;
    case 'export': exportCsv(); break;
    case 'restore-draft':
      try { draft = JSON.parse(admin.stash); markDirty('restored'); } catch (err) {}
      admin.stash = null; ss.del('shop-draft'); renderAll(); break;
    case 'drop-stash': admin.stash = null; ss.del('shop-draft'); renderAdmin(); break;
    case 'ph-sel': ed.active = Number(v); renderEditor(); break;
    case 'ph-cover': if (ed.active > 0) { ed.photos.unshift(ed.photos.splice(ed.active, 1)[0]); ed.active = 0; renderEditor(); } break;
    case 'ph-rm': ed.photos.splice(ed.active, 1); ed.active = Math.max(0, Math.min(ed.active, ed.photos.length - 1)); renderEditor(); break;
    case 'seed-undo': if (cur && cur.seeds.length) { cur.seeds.pop(); schedule(cur); } break;
    case 'seed-clear': if (cur) { cur.seeds = []; schedule(cur); } break;
    case 'bg': if (cur) { cur.set.bg = v; ls.set('shop-lastset', cur.set); document.querySelectorAll('.sw').forEach(function (s) { s.setAttribute('aria-pressed', s.dataset.v === v); }); schedule(cur); } break;
    case 'apply-all':
      if (cur) { ed.photos.forEach(function (p) { if (p.kind === 'new' && p !== cur) { p.set = Object.assign({}, cur.set); schedule(p); } }); toast('已套用到全部新照片'); } break;
    case 'ed-save': saveEditor(); break;
    case 'ed-cancel': admin.ed = null; admin.tab = 'list'; renderAdmin(); break;
  }
});
document.addEventListener('input', function (e) {
  var t = e.target;
  if (t.id === 'q') { ui.q = t.value; renderGrid(); return; }
  if (t.id === 'pref-time') { pref.time = t.value; savePref(); var m = $('#msg'); if (m) m.textContent = buildMsg(); return; }
  if (t.dataset.shop) { draft.shop[t.dataset.shop] = t.value; markDirty('shop'); var pill = $('.adm-bar .pill'); if (pill) { pill.textContent = '未發布 ' + dirtyCount() + ' 項'; pill.classList.add('dirty'); } var pb = $('[data-act="publish"]'); if (pb && !admin.readOnly) pb.disabled = false; return; }
  var ed = admin.ed; if (!ed) return;
  if (t.dataset.f) { ed.f[t.dataset.f] = t.value; return; }
  if (t.dataset.m) { ed.f.m[t.dataset.m] = t.value; return; }
  if (t.dataset.set) {
    var cur = ed.photos[ed.active]; if (!cur || cur.kind !== 'new') return;
    cur.set[t.dataset.set] = Number(t.value); var o = $('#v-' + t.dataset.set); if (o) o.textContent = t.value;
    ls.set('shop-lastset', cur.set); schedule(cur);
  }
});
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.id === 'f-size') { ui.size = t.value; saveUi(); renderGrid(); return; }
  if (t.id === 'f-sort') { ui.sort = t.value; saveUi(); renderGrid(); return; }
  if (t.id === 'f-hide') { ui.hideSold = t.checked; saveUi(); renderGrid(); return; }
  if (t.id === 'st-sel') { pref.station = t.value; savePref(); var m = $('#msg'); if (m) m.textContent = buildMsg(); document.querySelectorAll('.stop').forEach(function (s) { var on = s.dataset.v === t.value; s.classList.toggle('on', on); s.setAttribute('aria-pressed', on); }); return; }
  if (t.id === 'ed-file') { addFiles(t.files); t.value = ''; return; }
  if (t.dataset.status) {
    var it = draft.items.filter(function (x) { return x.id === t.dataset.status; })[0]; if (!it) return;
    var old = it.status; it.status = t.value; it.updatedAt = new Date().toISOString();
    if (t.value === 'sold' && old !== 'sold') it.soldAt = it.updatedAt;
    addLog('狀態', it.id, STATUS[old].label + '→' + STATUS[t.value].label); markDirty('item:' + it.id);
    renderAll(); return;
  }
  var ed = admin.ed; if (!ed) return;
  if (t.dataset.f === 'cat') { ed.f.cat = t.value; renderEditor(); return; }
  if (t.dataset.tog) {
    var cur = ed.photos[ed.active]; if (!cur || cur.kind !== 'new') return;
    cur.set[t.dataset.tog] = t.checked; ls.set('shop-lastset', cur.set); renderEditor();
  }
});
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  if (ui.open) { ui.open = null; renderModal(); renderBar(); }
  else if (ui.sheet) { ui.sheet = false; renderSheet(); renderBar(); }
});

/* ---------- boot ---------- */
['modal', 'sheet', 'admin', 'ibar', 'toast'].forEach(function (id) {
  var d = document.createElement('div'); d.id = id; d.hidden = true;
  d.className = id === 'modal' || id === 'sheet' ? 'layer' : id === 'admin' ? 'adm' : id === 'ibar' ? 'ibar' : 'toast';
  if (id === 'toast') d.setAttribute('role', 'status');
  document.body.appendChild(d);
});
renderAll();

var stash = ss.get('shop-draft');
if (stash) { if (stash === JSON.stringify(published)) ss.del('shop-draft'); else admin.stash = stash; }
var reopen = ss.get('shop-admin') === '1'; ss.del('shop-admin');

if (window.claude && typeof window.claude.use === 'function') {
  window.claude.use('artifact').then(function (ns) {
    caps.art = ns; if (!admin.open) renderPublic();
    if (ns && (reopen || admin.stash)) { openAdmin(); if (!dirtyCount() && admin.stash) renderAdmin(); }
  });
  window.claude.use('user').then(function (u) {
    caps.user = u; if (!u) return;
    return u.canEdit().then(function (ok) { caps.canEdit = !!ok; if (!admin.open) renderPublic(); else renderAdmin(); });
  });
  window.claude.use('downloads').then(function (ns) { caps.dl = ns; if (admin.open && admin.tab === 'list') renderAdminTab(); });
}
})();
</script>
