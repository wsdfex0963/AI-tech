<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AI科技持股儀表板</title>


<style>
:root{
  --bg:#f4f6f9;
  --surface:#ffffff;
  --surface-2:#eef1f5;
  --border:#dde2e9;
  --text:#1c232e;
  --text-dim:#5b6472;
  --text-faint:#94a0ad;
  --accent:#1c6e8c;
  --accent-soft:#e3eef2;
  --green:#1a8a4a;
  --green-soft:#e5f4ea;
  --amber:#a86a12;
  --amber-soft:#faf0dd;
  --red:#c0392b;
  --red-soft:#fbe9e7;
  --shadow:0 1px 2px rgba(20,30,45,.06),0 8px 24px -12px rgba(20,30,45,.12);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11151b;
    --surface:#181e26;
    --surface-2:#1f2630;
    --border:#2b333f;
    --text:#e7ebf0;
    --text-dim:#a3adb9;
    --text-faint:#6d7684;
    --accent:#5ab3d4;
    --accent-soft:#1b3540;
    --green:#4fbf7f;
    --green-soft:#173226;
    --amber:#e0a63d;
    --amber-soft:#3a2d13;
    --red:#e8695c;
    --red-soft:#3a1e1a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#11151b;
  --surface:#181e26;
  --surface-2:#1f2630;
  --border:#2b333f;
  --text:#e7ebf0;
  --text-dim:#a3adb9;
  --text-faint:#6d7684;
  --accent:#5ab3d4;
  --accent-soft:#1b3540;
  --green:#4fbf7f;
  --green-soft:#173226;
  --amber:#e0a63d;
  --amber-soft:#3a2d13;
  --red:#e8695c;
  --red-soft:#3a1e1a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"Noto Sans TC",-apple-system,sans-serif;
  margin:0;
  padding:28px 20px 60px;
  line-height:1.55;
}
.tabular{font-variant-numeric:tabular-nums;font-family:ui-monospace,Menlo,Consolas,monospace;}
.page{max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:22px;}

.header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px;}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);font-weight:600;}
h1{font-size:26px;margin:4px 0 0;font-weight:700;text-wrap:balance;}
.datebadge{font-size:12px;color:var(--text-dim);background:var(--surface-2);border:1px solid var(--border);padding:6px 12px;border-radius:99px;white-space:nowrap;}

.conclusion{
  background:var(--accent-soft);
  border:1px solid var(--accent);
  border-radius:12px;
  padding:16px 20px;
  font-size:15.5px;
  color:var(--text);
}
.conclusion b{color:var(--accent);}

.alertbar{background:var(--red-soft);border:1px solid var(--red);border-radius:12px;padding:14px 20px;font-size:14.5px;color:var(--text);}
.alertbar b{color:var(--red);}
.okbar{background:var(--green-soft);border:1px solid var(--green);border-radius:12px;padding:14px 20px;font-size:14.5px;color:var(--text);}
.okbar b{color:var(--green);}
.askbar{background:var(--amber-soft);border:1px solid var(--amber);border-radius:12px;padding:14px 20px;font-size:14.5px;color:var(--text);}
.askbar b{color:var(--amber);}
.todolist li.done{opacity:.62;}
.todolist li.done .box{background:var(--green);border-color:var(--green);}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.stat{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  padding:16px 18px;
  box-shadow:var(--shadow);
}
.stat .label{font-size:12px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;}
.stat .value{font-size:24px;font-weight:700;margin-top:6px;}
.stat .sub{font-size:12.5px;color:var(--text-dim);margin-top:3px;}
.pos{color:var(--green);}
.neg{color:var(--red);}

.grid2{display:grid;grid-template-columns:340px 1fr;gap:18px;}
@media (max-width:820px){.grid2{grid-template-columns:1fr;}}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  padding:20px;
  box-shadow:var(--shadow);
}
.card h2{font-size:14px;margin:0 0 14px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);font-weight:700;}

.chartwrap{display:flex;flex-direction:column;align-items:center;gap:10px;}
.chart-foot{font-size:12.5px;color:var(--text-dim);text-align:center;}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);padding:0 10px 8px;border-bottom:1px solid var(--border);font-weight:600;}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.ticker{font-weight:700;}
.dim{color:var(--text-faint);}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;}
.pill.red{background:var(--red-soft);color:var(--red);}
.pill.amber{background:var(--amber-soft);color:var(--amber);}
.pill.green{background:var(--green-soft);color:var(--green);}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none;}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media (max-width:820px){.row2{grid-template-columns:1fr;}}
.todolist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;}
.todolist li{display:flex;gap:10px;padding:10px 12px;background:var(--surface-2);border-radius:10px;border:1px solid var(--border);font-size:13.5px;}
.todolist .box{width:16px;height:16px;border:2px solid var(--text-faint);border-radius:4px;flex:none;margin-top:2px;}
.todolist .meta{color:var(--text-dim);font-size:12px;margin-top:2px;}

.cal{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;}
.cal li{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed var(--border);font-size:13.5px;}
.cal li:last-child{border-bottom:none;}
.cal .d{flex:none;width:64px;font-weight:700;color:var(--accent);font-size:12.5px;}
.cal .note{color:var(--text-dim);font-size:12px;}

.disc td.status-fail{color:var(--red);font-weight:600;}
.disc td.status-ok{color:var(--green);font-weight:600;}
.disc td.status-rev{color:var(--amber);font-weight:600;}

.footnote{
  font-size:12.5px;
  color:var(--text-dim);
  border-top:1px solid var(--border);
  padding-top:16px;
  line-height:1.7;
}
.footnote b{color:var(--text);}
.footnote .warn{color:var(--red);font-weight:600;}
.alertbar{background:var(--red-soft);border:1px solid var(--red);border-radius:12px;padding:14px 20px;font-size:14.5px;color:var(--text);}
.alertbar b{color:var(--red);}
.tblwrap{overflow-x:auto;}
.grid2>*,.row2>*{min-width:0;}
.kv td:first-child{color:var(--text-dim);white-space:nowrap;}
.lead{font-size:13.5px;color:var(--text);background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-top:14px;line-height:1.7;}
.lead b{color:var(--accent);}
.small{font-size:12px;color:var(--text-dim);margin-top:10px;line-height:1.6;}
@media (max-width:820px){.stats{grid-template-columns:repeat(2,1fr);}.grid2,.row2{grid-template-columns:1fr;}h1{font-size:22px;}body{padding:20px 16px 48px;}}
</style>
